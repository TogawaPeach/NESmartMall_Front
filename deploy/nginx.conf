server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite assets have content hashes; missing assets must return 404.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Support Vue Router history mode when opening or refreshing a route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
